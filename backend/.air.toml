root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  full_bin = "sh -c './tmp/main'"
  bin = "tmp/main"
  delay = 1000
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
